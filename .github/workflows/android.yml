name: Android (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Gerar APK de teste
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: balcao-farmaceutico-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK no link fixo de download
        if: github.ref == 'refs/heads/main'
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk balcao-farmaceutico.apk
          gh release delete apk-teste --yes --cleanup-tag || true
          gh release create apk-teste balcao-farmaceutico.apk --title "Balcão Farmacêutico (APK de teste)" --notes "APK gerado automaticamente a partir de ${GITHUB_SHA::7}. Abra este link no celular Android para baixar e instalar." --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
